<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Oh, hey. I'm Darsh. You found my little corner of the internet.">
  <meta name="theme-color" content="#080a13">
  <title>Oh, hey. — Darsh Chohan</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Courier New', Courier, monospace;
      background: #080a13;
      color: #ede4d5;
      font-synthesis: none;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.5rem, 5vw, 4.5rem);
      background:
        radial-gradient(ellipse at 48% 48%, #49213728, transparent 52%),
        radial-gradient(ellipse at 80% 100%, #142e351f, transparent 45%),
        #080a13;
    }

    header {
      font-size: 0.875rem;
      letter-spacing: 0.12em;
      color: #c9b7a7;
    }

    main {
      width: min(100%, 60rem);
      margin: auto;
      padding: 5rem 0 6rem;
    }

    h1 {
      width: fit-content;
      margin: 0 0 1.6rem;
      padding: 0 0.08em 0.06em 0;
      font-family: 'Brush Script MT', 'Segoe Script', 'URW Chancery L', cursive;
      font-size: clamp(5rem, 16vw, 12rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.1;
      letter-spacing: -0.035em;
      color: #ffd8e5;
      text-shadow:
        0 0 2px #fff4f8,
        0 0 7px #ff96bd,
        0 0 18px #fc508c,
        0 0 42px #ff327f80,
        0 0 90px #ed266533;
      transform: rotate(-5deg);
      transform-origin: left center;
    }

    .hello {
      margin: 0 0 1.1rem;
      color: #b8e8e3;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-style: italic;
      line-height: 1.4;
      text-shadow: 0 0 12px #78cac13b;
    }

    .aside {
      max-width: 36ch;
      margin: 0;
      color: #b7a9aa;
      font-size: 1rem;
      line-height: 1.8;
    }

    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem 2rem;
      color: #a79ca4;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    footer p { margin: 0; }

    @media (max-width: 40rem) {
      main { padding: 5rem 0 6rem; }
      h1 { font-size: clamp(4.5rem, 20vw, 8rem); }
      .aside { max-width: 28ch; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>darsh chohan</header>
    <main>
      <h1>oh, hey.</h1>
      <p class="hello">i’m darsh.</p>
      <p class="aside">you found me.<br>i was trying to be mysterious.</p>
    </main>
    <footer>
      <p>more soon. probably.</p>
      <p>darshchohan.com</p>
    </footer>
  </div>
</body>
</html>
