  <style>
    :root {
      color-scheme: dark;
      font-family: 'Courier New', Courier, monospace;
      background: #080a13;
      color: #ede4d5;
      font-synthesis: none;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.5rem, 5vw, 4.5rem);
      background:
        radial-gradient(ellipse at 48% 48%, #65431824, transparent 52%),
        radial-gradient(ellipse at 80% 100%, #1732541f, transparent 45%),
        #080a13;
    }

    header {
      font-size: 1rem;
      letter-spacing: 0.12em;
      color: #c9b7a7;
    }

    main {
      width: min(100%, 60rem);
      margin: auto;
      padding: 5rem 0 6rem;
    }

    h1 {
      width: fit-content;
      margin: 0 0 1.6rem;
      padding: 0 0.08em 0.06em 0;
      font-family: 'Brush Script MT', 'Segoe Script', 'URW Chancery L', cursive;
      font-size: clamp(5rem, 16vw, 12rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.1;
      letter-spacing: -0.035em;
      color: #ffe5ad;
      transform: rotate(-5deg);
      transform-origin: left center;
    }

    .neon {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-shadow:
        0 0 2px #fff5dc,
        0 0 7px #ffc163,
        0 0 18px #f79b32,
        0 0 42px #f68d2180,
        0 0 90px #d9791833,
        var(--shadow-x, 0px) var(--shadow-y, 12px) 2px #163a51,
        var(--shadow-x, 0px) var(--shadow-y, 12px) 26px #3b83ac66;
      cursor: pointer;
      transform: perspective(700px) translate3d(var(--move-x, 0px), var(--move-y, 0px), 0) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
      transition: transform 110ms ease-out, filter 180ms ease-out, color 180ms ease-out, text-shadow 110ms ease-out;
      -webkit-tap-highlight-color: transparent;
    }

    .neon:hover { filter: brightness(1.2); }
    .neon:focus-visible { outline: 1px dashed #ffc163; outline-offset: 12px; }
    .neon[aria-pressed="false"] {
      color: #65523b;
      text-shadow: 0 1px 1px #a0885c44;
      filter: none;
    }

    .hello {
      margin: 0 0 1.1rem;
      color: #b5cfe8;
      font-family: inherit;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-style: normal;
      line-height: 1.4;
      text-shadow: 0 0 12px #729ec43b;
    }

    .aside {
      max-width: 100%;
      margin: 0;
      color: #b5b2aa;
      font-size: 1rem;
      line-height: 1.8;
    }

    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem 2rem;
      color: #a5a5a0;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    footer p { margin: 0; }

    .coffee-corner {
      position: fixed;
      right: clamp(1.5rem, 5vw, 4.5rem);
      bottom: clamp(1.5rem, 5vw, 4.5rem);
      z-index: 2;
      display: block;
      width: clamp(10rem, 18vw, 14rem);
      padding: 0;
      border: 1px solid #98acac4d;
      border-radius: 50%;
      background: #12212a;
      box-shadow: 0 16px 28px #0007, 0 0 30px #6e9dba15;
      cursor: pointer;
      transform: scale(var(--orb-scale, 1));
      transform-origin: right bottom;
      transition: transform 600ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 600ms ease;
    }

    .coffee-corner::before, .coffee-corner::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
    }

    .coffee-corner::before {
      background:
        radial-gradient(ellipse at 28% 18%, #f5f7e966, transparent 22%),
        radial-gradient(ellipse at 90% 80%, #7bb4e42e, transparent 45%);
      box-shadow: inset -16px -20px 30px #000a, inset 7px 9px 15px #d1dacc26, inset 0 0 5px #e2f2e566;
    }

    .coffee-corner::after {
      background: linear-gradient(125deg, transparent 16%, #f6f9e14d 24%, transparent 40%);
      opacity: calc(0.22 + var(--orb-nearness, 0) * 0.65);
      transform: rotate(var(--orb-reflection, -12deg));
      transition: opacity 400ms ease, transform 600ms ease;
    }

    .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"]) {
      transform: scale(1.52);
      box-shadow: 0 20px 38px #0009, 0 0 45px #9fbfd333, 0 0 80px #c69a5d12;
    }

    .coffee-corner:focus-visible {
      outline: 1px dashed #ffc163;
      outline-offset: 6px;
    }

    .coffee-scene {
      position: relative;
      display: block;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 20% 35%, #c28b311f, transparent 50%),
        linear-gradient(#263d46 1px, transparent 1px),
        linear-gradient(90deg, #263d46 1px, transparent 1px), #152a33;
      background-size: auto, 2.7rem 1.8rem, 2.7rem 1.8rem;
      font-size: clamp(12px, 1.1vw, 16px);
    }

    .cafe-lamp {
      position: absolute;
      top: 0;
      left: 15%;
      width: 21%;
      height: 28%;
      border-top: 0;
    }

    .cafe-lamp::before {
      content: '';
      position: absolute;
      width: 1px;
      height: 70%;
      left: 50%;
      background: #9a8560;
    }

    .cafe-lamp::after {
      content: '';
      position: absolute;
      inset: 60% 0 0;
      border-bottom: 2px solid #ffe5ad;
      background: #b28243;
      clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
    }

    .machine {
      position: absolute;
      right: 10%;
      bottom: 43%;
      width: 40%;
      height: 41%;
      border: 3px solid #777d78;
      border-radius: 5px 5px 0 0;
      background: linear-gradient(90deg, #929a90, #b0b4a0 50%, #74847f);
      box-shadow: 4px 4px #0a161f;
    }

    .machine::before {
      content: '';
      position: absolute;
      inset: 9% 9% 42%;
      border: 1px solid #4a5753;
      background: #25362f;
    }

    .machine::after {
      content: '';
      position: absolute;
      width: 17%;
      aspect-ratio: 1;
      right: 16%;
      top: 16%;
      border: 2px solid #bfc0a7;
      border-radius: 50%;
      background: linear-gradient(45deg, #e6dab8 45%, #383e31 46% 53%, #e6dab8 54%);
    }

    .portafilter {
      position: absolute;
      left: 17%;
      top: 67%;
      width: 55%;
      height: 8%;
      background: #23352e;
      box-shadow: 0 3px #66756d;
    }

    .portafilter::before {
      content: '';
      position: absolute;
      bottom: 100%;
      width: 35%;
      height: 150%;
      background: #c2bfa5;
    }

    .counter {
      position: absolute;
      inset: auto 0 23%;
      height: 10%;
      border-top: 4px solid #c69a5d;
      background: repeating-linear-gradient(0deg, #795136 0 3px, #6d472f 3px 5px);
      box-shadow: 0 4px 8px #0005;
    }

    .cafe-floor {
      position: absolute;
      inset: 77% 0 0;
      background: conic-gradient(#b3ad8b 25%, #263e42 0 50%, #b3ad8b 0 75%, #263e42 0) 0 0 / 2rem 2rem;
      opacity: 0.5;
    }

    .coffee-cup {
      position: absolute;
      left: 53%;
      bottom: 32%;
      width: 17%;
      height: 18%;
      border: 3px solid #e8d9b4;
      border-radius: 2px 2px 12px 12px;
      background: #b8b99d;
      box-shadow: inset -6px 0 #8b9c8f, 0 7px 0 -4px #d2c49d;
    }

    .coffee-cup::after {
      content: '';
      position: absolute;
      left: 100%;
      top: 2px;
      width: 40%;
      height: 65%;
      border: 3px solid #e8d9b4;
      border-radius: 0 60% 60% 0;
    }

    .coffee-cup::before {
      content: '';
      position: absolute;
      left: 2px;
      right: 2px;
      top: 0;
      height: 15%;
      border-radius: 50%;
      background: #454e41;
      transition: background 500ms 500ms;
    }

    .pour {
      position: absolute;
      left: 60%;
      top: 46%;
      width: 2px;
      height: 8%;
      background: #8f542c;
      transform-origin: top;
      opacity: 0;
    }

    .steam {
      position: absolute;
      left: 22%;
      bottom: calc(100% + 5px);
      width: 0.5em;
      height: 1.7em;
      border-left: 2px solid #d1d9c2;
      border-radius: 50%;
      opacity: 0;
    }

    .steam::after {
      content: '';
      position: absolute;
      left: 0.8em;
      top: -0.3em;
      width: 0.5em;
      height: 1.7em;
      border-left: 2px solid #d1d9c2;
      border-radius: 50%;
    }

    .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"], .is-near) .steam {
      animation: steam-rise 2.4s 750ms ease-out infinite;
    }

    .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"], .is-near) .pour {
      animation: espresso-pour 4s 350ms ease-in-out infinite;
    }

    .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"], .is-near) .machine::after {
      animation: pressure-gauge 4s ease-in-out infinite;
    }

    .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"], .is-near) .coffee-cup::before {
      background: #6b3b1d;
      box-shadow: inset 0 1px #c79858;
    }

    @keyframes steam-rise {
      0% { opacity: 0; transform: translateY(5px) rotate(-8deg); }
      35% { opacity: 0.65; }
      100% { opacity: 0; transform: translateY(-22px) rotate(10deg); }
    }

    @keyframes espresso-pour {
      0%, 80%, 100% { opacity: 0; transform: scaleY(0); }
      15%, 65% { opacity: 0.9; transform: scaleY(1); }
    }

    @keyframes pressure-gauge {
      0%, 100% { transform: rotate(-15deg); }
      40%, 70% { transform: rotate(35deg); }
    }

    @media (max-width: 40rem) {
      .page {
        min-height: 100svh;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      }

      main {
        align-self: center;
        margin: 0;
        padding: 3rem 0;
      }

      h1 {
        margin-bottom: 1.5rem;
        font-family: 'Yellowtail', 'Brush Script MT', 'Segoe Script', cursive;
        font-size: clamp(5rem, 25vw, 8rem);
        font-style: normal;
        line-height: 1.05;
      }

      .neon {
        text-shadow:
          0 0 1px #fff5dc,
          0 0 5px #ffc163,
          0 0 14px #f79b32b3,
          0 0 34px #f68d214d;
      }

      .hello {
        margin-bottom: 1rem;
        font-size: clamp(1.25rem, 6vw, 1.5rem);
      }

      .aside {
        max-width: 28ch;
        line-height: 1.7;
      }

      footer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 1rem;
        font-size: 0.8125rem;
      }

      .coffee-corner {
        position: relative;
        right: auto;
        bottom: auto;
        width: clamp(6rem, 28vw, 7.25rem);
        margin: 0;
      }

      .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"]) {
        transform: scale(1.4);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .neon { transform: none; transition: none; }
      .coffee-corner, .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"]) { transform: none; transition: none; }
      .coffee-corner::after { transition: none; }
      .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"], .is-near) :is(.steam, .pour),
      .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"], .is-near) .machine::after { animation: none; }
      .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"]) .steam { opacity: 0.6; }
      .coffee-corner:is(:hover, :focus-visible, [aria-pressed="true"]) .pour { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>darsh chohan</header>
    <main>
      <h1><button class="neon" type="button" aria-pressed="true" aria-label="neon hello, switch light off" title="click to switch the neon on or off">oh, hey.</button></h1>
      <p class="hello">i’m darsh.</p>
      <p class="aside">you found me.<br>i like to build things that are nice.</p>
    </main>
    <footer>
      <p>more soon. probably.</p>
      <button class="coffee-corner" type="button" aria-label="animate the coffee corner" aria-pressed="false">
        <span class="coffee-scene" aria-hidden="true">
          <span class="cafe-lamp"></span>
          <span class="machine"><span class="portafilter"></span></span>
          <span class="cafe-floor"></span>
          <span class="counter"></span>
          <span class="pour"></span>
          <span class="coffee-cup"><span class="steam"></span></span>
        </span>
      </button>
    </footer>
  </div>
  <script>
    const neon = document.querySelector('.neon');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    document.addEventListener('pointermove', (event) => {
      if (event.pointerType === 'touch' || reducedMotion.matches) return;
      const horizontal = event.clientX / window.innerWidth - 0.5;
      const vertical = event.clientY / window.innerHeight - 0.5;
      neon.style.setProperty('--move-x', `${horizontal * 64}px`);
      neon.style.setProperty('--move-y', `${vertical * 44}px`);
      neon.style.setProperty('--tilt-x', `${-vertical * 24}deg`);
      neon.style.setProperty('--tilt-y', `${horizontal * 28}deg`);
      neon.style.setProperty('--shadow-x', `${-horizontal * 56}px`);
      neon.style.setProperty('--shadow-y', `${12 - vertical * 40}px`);

      const coffeeBounds = coffeeCorner.getBoundingClientRect();
      const centerX = coffeeBounds.right - coffeeCorner.offsetWidth / 2;
      const centerY = coffeeBounds.bottom - coffeeCorner.offsetHeight / 2;
      const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
      const proximity = Math.max(0, 1 - distance / 450);
      const nearness = proximity * proximity;
      coffeeCorner.style.setProperty('--orb-scale', String(1 + nearness * 0.52));
      coffeeCorner.style.setProperty('--orb-nearness', String(nearness));
      coffeeCorner.style.setProperty('--orb-reflection', `${-12 + horizontal * 40}deg`);
      coffeeCorner.classList.toggle('is-near', proximity > 0.55);
    });

    document.documentElement.addEventListener('pointerleave', () => {
      neon.style.removeProperty('--move-x');
      neon.style.removeProperty('--move-y');
      neon.style.removeProperty('--tilt-x');
      neon.style.removeProperty('--tilt-y');
      neon.style.removeProperty('--shadow-x');
      neon.style.removeProperty('--shadow-y');
      coffeeCorner.style.removeProperty('--orb-scale');
      coffeeCorner.style.removeProperty('--orb-nearness');
      coffeeCorner.style.removeProperty('--orb-reflection');
      coffeeCorner.classList.remove('is-near');
    });

    neon.addEventListener('click', () => {
      const isOn = neon.getAttribute('aria-pressed') === 'true';
      neon.setAttribute('aria-pressed', String(!isOn));
      neon.setAttribute('aria-label', `neon hello, switch light ${isOn ? 'on' : 'off'}`);
    });

    const coffeeCorner = document.querySelector('.coffee-corner');

    coffeeCorner.addEventListener('click', () => {
      const isPinned = coffeeCorner.getAttribute('aria-pressed') === 'true';
      coffeeCorner.setAttribute('aria-pressed', String(!isPinned));
    });

    coffeeCorner.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        coffeeCorner.setAttribute('aria-pressed', 'false');
        coffeeCorner.blur();
      }
    });
  </script>
</body>
</html>
