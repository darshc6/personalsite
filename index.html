<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Darsh Chohan's little corner of the internet. Please do not pick up the phone.">
  <meta name="theme-color" content="#171b16">
  <title>Darsh Chohan's Homepage</title>
  <style>
    :root {
      color-scheme: dark;
      --desk: #171b16;
      --ink: #eee8c9;
      --muted: #bcb7a0;
      --lime: #d9fa82;
      --orange: #ff8e61;
      --border: #666952;
      --dark: #10140f;
      font-family: 'Courier New', Courier, monospace;
      background: var(--desk);
      color: var(--ink);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    .desktop {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 1.25rem;
      padding: 3rem 1.5rem;
      background-image: radial-gradient(#555943 0.75px, transparent 0.75px);
      background-size: 12px 12px;
    }

    .window {
      width: min(100%, 58rem);
      border: 1px solid var(--border);
      background: var(--dark);
      box-shadow: 8px 8px 0 #090b08;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      background: var(--lime);
      color: #242c18;
      font-size: 0.875rem;
      font-weight: bold;
    }

    .window-marks { display: flex; gap: 0.3rem; }
    .window-marks span { width: 0.65rem; height: 0.65rem; border: 1px solid currentColor; }
    .window-marks span:first-child { background: currentColor; }

    .address {
      margin: 0;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #252a20;
      font-size: 0.875rem;
      overflow-wrap: anywhere;
    }

    .address span { margin-right: 0.65rem; color: var(--muted); }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(1.5rem, 4vw, 3.5rem);
      padding: clamp(2rem, 6vw, 4.25rem);
    }

    h1 {
      margin: 0;
      color: var(--lime);
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(2.5rem, 7.6vw, 5.6rem);
      line-height: 0.92;
      letter-spacing: -0.095em;
      text-shadow: 3px 3px #414c2b;
    }

    .intro { max-width: 35ch; margin: 1.4rem 0 1.65rem; font-size: 1rem; line-height: 1.65; }

    button {
      padding: 0.7rem 0.95rem;
      border: 1px solid var(--orange);
      background: var(--orange);
      box-shadow: 3px 3px #7f4939;
      color: #211710;
      cursor: pointer;
      font: bold 0.9rem/1.25 'Courier New', Courier, monospace;
    }

    button:hover { background: #ffab8c; }
    button:active { translate: 2px 2px; box-shadow: 1px 1px #7f4939; }
    button:focus-visible { outline: 2px dashed var(--lime); outline-offset: 5px; }

    .computer { width: min(100%, 17rem); margin: 0 auto; }

    .case {
      padding: 8%;
      border: 2px solid #29271f;
      border-radius: 8% 8% 6% 6%;
      background: #c6b68f;
      box-shadow: inset 4px 4px #f2dfb2, inset -5px -5px #8d805f, 7px 7px #090b08;
    }

    .screen {
      display: grid;
      place-items: center;
      aspect-ratio: 1.3;
      width: 100%;
      border: 5px solid #403c2d;
      border-radius: 12%;
      background: repeating-linear-gradient(transparent 0 3px, #0e170e55 3px 4px), radial-gradient(#35482a, #182519 75%);
      box-shadow: 0 0 0 2px #968363, inset 0 0 1rem #10170f;
      color: var(--lime);
    }

    .face { width: 100%; margin: 0; text-align: center; font: bold clamp(2.5rem, 6vw, 4.25rem)/1 monospace; text-shadow: 0 0 12px #d9fa8270; }
    .case-details { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: 9% 3% 0; }
    .vents { width: 32%; height: 0.6rem; background: repeating-linear-gradient(90deg, #73684f 0 2px, transparent 2px 5px); }
    .light { width: 0.45rem; height: 0.45rem; border: 1px solid #555c36; border-radius: 50%; background: #e9fe9e; }
    .stand { width: 70%; height: 0.7rem; margin: 0 auto; border: 2px solid #29271f; background: #a09272; box-shadow: inset 0 -2px #766b53, 5px 5px #090b08; }
    .computer[data-pose="wave"] .face { animation: nod 260ms ease-out; }
    @keyframes nod { 50% { transform: translateY(-0.2em) rotate(-8deg); } }

    .status {
      min-height: 3.25rem;
      margin: 0;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      border-top: 1px solid var(--border);
      background: #252a20;
      color: var(--ink);
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .status::before { content: ''; width: 0.5rem; height: 0.5rem; flex: 0 0 auto; background: var(--lime); }
    footer { width: min(100%, 58rem); color: var(--muted); font-size: 0.875rem; line-height: 1.4; }

    @media (max-width: 42rem) {
      .content { grid-template-columns: 1fr; }
      .computer { max-width: 12rem; margin: 0.5rem 0 0; }
    }

    @media (max-width: 24rem) {
      .desktop { padding: 1.5rem 0.75rem; }
      .content { padding: 1.5rem 1.1rem 2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .computer[data-pose="wave"] .face { animation: none; }
    }
  </style>
</head>
<body>
  <div class="desktop">
    <main class="window" aria-labelledby="hello">
      <div class="titlebar">
        <span>Darsh's Homepage</span>
        <div class="window-marks" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <p class="address"><span>Address</span>darshchohan.com</p>
      <div class="content">
        <div>
          <h1 id="hello">Hi, I’m<br>Darsh.</h1>
          <p class="intro">I made a website. My mom said it loaded.</p>
          <button id="wave" type="button" hidden>Wave back</button>
        </div>
        <div class="computer" id="computer" aria-hidden="true">
          <div class="case">
            <div class="screen"><p class="face" id="face">:)</p></div>
            <div class="case-details"><span class="vents"></span><span class="light"></span></div>
          </div>
          <div class="stand"></div>
        </div>
      </div>
      <p class="status" id="status" role="status">Connected. Please do not pick up the phone.</p>
    </main>
    <footer>Darsh Chohan · Best viewed from a swivel chair.</footer>
  </div>
  <script>
    const button = document.querySelector('#wave');
    const computer = document.querySelector('#computer');
    const face = document.querySelector('#face');
    const status = document.querySelector('#status');
    const replies = [
      [';)', 'Wave received. The computer is blushing.'],
      [':D', 'Second wave received. This is basically a chat room.'],
      [':)', 'Still here. Still on the phone line.']
    ];
    let nextReply = 0;

    button.addEventListener('click', () => {
      const [expression, message] = replies[nextReply];
      face.textContent = expression;
      status.textContent = message;
      computer.dataset.pose = nextReply % 2 === 0 ? 'wave' : 'still';
      nextReply = (nextReply + 1) % replies.length;
    });

    button.hidden = false;
  </script>
</body>
</html>
